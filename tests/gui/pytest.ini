[pytest]
# Put src/ on sys.path so tests import both the GUI package and the engine
# without installing them:  from prismGui.domain... import ...  /  from CPM... import ...
# tests/gui/ is two levels below the repo root, so ../../src reaches src/.
pythonpath = ../../src
testpaths  = .
addopts    = -v --tb=short

# --- Marker registration (CI ENFORCEMENT MACHINERY, block 1) -----------------
# A test carrying NONE of these markers is a REQUIRED Phase-1 contract. "Required"
# is the default so an uncategorized new test fails loud (see conftest.py gate).
markers =
    phase2: deferred to Phase 2; deselected from the default Phase-1 CI job
    adapter_integration: needs a real PRISM runtime; runs in the integration job, not the pure-contract job
    benchmark: measured runtime/scale; thresholds asserted in the benchmark job
