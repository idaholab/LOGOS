version: '3.8'
name: Composition
services:
  postgres:
    image: postgres:15
    container_name: RAVEN_compose
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-RAVEN_Application_DB}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sample_data.sql:/docker-entrypoint-initdb.d/02-sample_data.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-RAVEN_Application_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  streamlit:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: RAVEN_Streamlit_compose
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-RAVEN_Application_DB}
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./Main.py:/app/Main.py:ro

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge